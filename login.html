<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Mess Manager</title>
    <link rel="stylesheet" href="/Styles/style.css">
</head>

<body class="h-screen flex justify-center items-center bg-cover bg-center"
      style="background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb');">

    <section>
        <fieldset class="bg-white/30 backdrop-blur-lg border border-white/40 
                         rounded-xl w-80 p-6 shadow-xl">
            
            <legend class="text-lg font-bold mb-4 text-black">Login</legend>

            <label class="block mb-1 text-black">Email</label>
            <input id="input-email" type="email" class="w-full p-2 rounded border-none focus:outline-none mb-4 " placeholder="Email" />

            <label class="block mb-1 text-black">Password</label>
            <input id="input-password" type="password" class="w-full p-2 rounded mb-4 border-none focus:outline-none" placeholder="Password" />

            <button id="login-btn" class="w-full bg-black text-white p-2 rounded hover:bg-white duration-300 hover:text-black hover:cursor-pointer">Login</button>
        </fieldset>
    </section>


    <script src="/Scripts/login.js"></script>
</body>

</html>
