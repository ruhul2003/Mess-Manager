<!DOCTYPE html>
<html lang="en" class="bg-olive-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://kit.fontawesome.com/0398fc8d82.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Home</title>
    <link rel="stylesheet" href="/Styles/style.css">
</head>
<body class="w-10/12 mx-auto  h-screen">

    <!------------------------- Header ------------------------------>
    <header class="w-full mt-5 items-center ">
        <nav class="flex flex-row justify-between items-center w-full">
            <div><h1 class="text-4xl text-green-500 font-bold">MM.</h1></div>
            <div class="nav-menu">
                <ul class="flex flex-row gap-9">
                    <li class="text-lg hover:text-green-400 hover:bg-slate-400 px-2 py-2 rounded-md font-bold"><a href="#">Home</a></li>
                    <li class="text-lg hover:text-green-400 hover:bg-slate-400 px-2 py-2 rounded-md font-bold"><a href="#">About</a></li>
                    <li class="text-lg hover:text-green-400 hover:bg-slate-400 px-2 py-2 rounded-md font-bold"><a href="#">Contact</a></li>
                    <li class="text-lg hover:text-green-400 hover:bg-slate-400 px-2 py-2 rounded-md font-bold"><a href="#">Feedback</a></li>
                </ul>
            </div>

            <button id="logout-btn" class="btn btn-primary">Logout <i class="fa-solid fa-arrow-right-from-bracket"></i></button>

           
        </nav>
    </header>

    <!------------------------- Dashboard ------------------------------>
    <section class="mt-8 bg-blue-300 py-6 px-2 items-center">
        <h1 class="text-2xl font-bold ml-6">Mess Name, Month</h1>
        <div class="mt-8 ml-28 flex flex-col gap-4">
            <h2 class="text-2xl ">Mess Balance : <span class="ml-10 font-bold">0.00</span></h2>
            <h2 class="text-2xl ">Total Deposit : <span class="ml-10 font-bold">0.00</span></h2>
            <h2 class="text-2xl ">Mess Total Meal : <span class="ml-10 font-bold">0.00</span></h2>
            <h2 class="text-2xl ">Mess Total Meal Cost : <span class="ml-10 font-bold">0.00</span></h2>
            <h2 class="text-2xl ">Mess Meal Rate : <span class="ml-10 font-bold">0.00</span></h2>
        </div>
    </section>

    <!------------------------- Personal Information ------------------------------>

    <section class="mt-8 bg-blue-300 py-6 px-2">
        <h1 class="text-3xl font-bold text-center">Personal Information</h1>
        <div class="flex flex-row justify-center gap-40 mt-6">
            <div class="flex flex-col gap-5 justify-center items-center mt-5">
                <div class="w-28 flex justify-center items-center h-28 rounded-full border border-black">
                    <p class="text-center text-2xl font-medium">00</p>
                </div>
                <div>
                    <h2 class="text-center text-2xl font-semibold">My Meal</h2>
                </div>
            </div>
            <div class="flex flex-col gap-5 justify-center items-center mt-5">
                <div class="w-28 flex justify-center items-center h-28 rounded-full border border-black">
                    <p class="text-center text-2xl font-medium">00</p>
                </div>
                <div>
                    <h2 class="text-center text-2xl font-semibold">My Deposit</h2>
                </div>
            </div>
            <div class="flex flex-col gap-5 justify-center items-center mt-5">
                <div class="w-28 flex justify-center items-center h-28 rounded-full border border-black">
                    <p class="text-center text-2xl font-medium">00</p>
                </div>
                <div>
                    <h2 class="text-center text-2xl font-semibold">My Cost</h2>
                </div>
            </div>
            <div class="flex flex-col gap-5 justify-center items-center mt-5">
                <div class="w-28 flex justify-center items-center h-28 rounded-full border border-black">
                    <p class="text-center text-2xl font-medium">00</p>
                </div>
                <div>
                    <h2 class="text-center text-2xl font-semibold">Balance</h2>
                </div>
            </div>
        </div>
    </section>
    
</body>
</html>
