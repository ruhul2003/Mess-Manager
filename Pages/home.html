<!DOCTYPE html>
<html lang="en" class="bg-gradient-to-r from-blue-400 to-purple-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://kit.fontawesome.com/0398fc8d82.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    
    <title>Home</title>

</head>
<body class="w-10/12 mx-auto h-screen font-['Ubuntu']">

    <!------------------------- Header ------------------------------>
    <header class="w-full mt-5 items-center ">
        <nav class="flex flex-row justify-between items-center w-full">
            <div><h1 class="text-4xl text-green-500 font-bold">MM.</h1></div>
            <div class="nav-menu">
                <ul class="flex flex-row gap-9">
                    <li class="text-lg hover:text-green-400 hover:bg-slate-400 px-2 py-2 rounded-md font-bold"><a href="#">Home</a></li>
                    <li class="text-lg hover:text-green-400 hover:bg-slate-400 px-2 py-2 rounded-md font-bold"><a href="#">About</a></li>
                    <li class="text-lg hover:text-green-400 hover:bg-slate-400 px-2 py-2 rounded-md font-bold"><a href="#">Contact</a></li>
                    <li class="text-lg hover:text-green-400 hover:bg-slate-400 px-2 py-2 rounded-md font-bold"><a href="#">Feedback</a></li>
                </ul>
            </div>

            <button id="logout-btn" class="btn btn-primary">Logout <i class="fa-solid fa-arrow-right-from-bracket"></i></button>

           
        </nav>
    </header>

    <!------------------------- Dashboard ------------------------------>
    <section class="mt-8 bg-[#E0E7FF] py-6 px-2 items-center rounded-lg">
        <h1 class="text-2xl text-[#6367FF] font-bold ml-6">Mess Name, Month</h1>
        <div class="mt-8 ml-28 flex flex-col gap-4">
            <h2 class="text-2xl text-[#020452]">Mess Balance : <span class="ml-10 font-semibold">0.00</span></h2>
            <h2 class="text-2xl text-[#020452]">Total Deposit : <span class="ml-10 font-semibold">0.00</span></h2>
            <h2 class="text-2xl text-[#020452]">Mess Total Meal : <span class="ml-10 font-semibold">0.00</span></h2>
            <h2 class="text-2xl text-[#020452]">Mess Total Meal Cost : <span class="ml-10 font-semibold">0.00</span></h2>
            <h2 class="text-2xl text-[#020452]">Mess Meal Rate : <span class="ml-10 font-semibold">0.00</span></h2>
        </div>
    </section>

    <!------------------------- Personal Information ------------------------------>

    <section class="mt-8 bg-[#E0E7FF] py-6 px-2 rounded-lg">
        <h1 class="text-3xl font-bold text-[#6367FF] text-center">Personal Information</h1>
        <div class="flex flex-row justify-center gap-20 mt-6">
            <div class="flex flex-col gap-5 justify-center items-center mt-5">
                <div class="w-28 flex justify-center items-center h-28 rounded-full border-4 border-[#6367FF]">
                    <p class="text-center text-2xl font-medium">00</p>
                </div>
                <div>
                    <h2 class="text-center text-2xl text-[#292c72] font-semibold">My Meal</h2>
                </div>
            </div>
            <div class="flex flex-col gap-5 justify-center items-center mt-5">
                <div class="w-28 flex justify-center items-center h-28 rounded-full border-4 border-[#6367FF]">
                    <p class="text-center text-2xl font-medium">00</p>
                </div>
                <div>
                    <h2 class="text-center text-2xl text-[#292c72] font-semibold">My Deposit</h2>
                </div>
            </div>
            <div class="flex flex-col gap-5 justify-center items-center mt-5">
                <div class="w-28 flex justify-center items-center h-28 rounded-full border-4 border-[#6367FF]">
                    <p class="text-center text-2xl font-medium">00</p>
                </div>
                <div>
                    <h2 class="text-center text-2xl text-[#292c72] font-semibold">My Cost</h2>
                </div>
            </div>
            <div class="flex flex-col gap-5 justify-center items-center mt-5">
                <div class="w-28 flex justify-center items-center h-28 rounded-full border-4 border-[#6367FF]">
                    <p class="text-center text-2xl font-medium">00</p>
                </div>
                <div>
                    <h2 class="text-center text-2xl text-[#292c72] font-semibold">Balance</h2>
                </div>
            </div>
        </div>
    </section>

    <!------------------------- Management ------------------------------>

    <section class="mt-7 py-4 bg-[#E0E7FF] pl-3 rounded-lg">
        <div class="flex flex-col gap-7 w-52">
            <button class="btn btn-outline  btn-primary">Add Member</button>
            <button class="btn btn-outline  btn-primary">Add Deposit</button>
            <button class="btn btn-outline  btn-primary">Add Meal</button>
            <button class="btn btn-outline  btn-primary">Add Cost</button>
            <button class="btn btn-outline  btn-primary">Active Month Details</button>
        </div>
    </section>

    <!--------------------------- Advance ------------------------------>

    <section class="mt-7 bg-[#E0E7FF] flex flex-col justify-center items-center rounded-lg mb-5">
        <div class="py-7 mx-auto flex flex-row gap-7">
            <button class="btn btn-primary">All Member <i class="fa-solid fa-user-group"></i></button>
            <button class="btn btn-primary ">Change Manager <i class="fa-solid fa-person-military-to-person"></i></button>
            <button class="btn btn-primary ">Start New Month <i class="fa-regular fa-calendar"></i></button>
            <button class="btn btn-primary ">All Month <i class="fa-regular fa-rectangle-list"></i></button>
            <button class="btn btn-warning ">Delete Mess <i class="fa-solid fa-trash-can"></i></button>
        </div>
    </section>
    
</body>
</html>
